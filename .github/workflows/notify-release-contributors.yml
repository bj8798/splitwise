name: Notify Release PR Contributors

on:
  pull_request:
    types: [opened, reopened]
    # branches:
    #   - master  # or your release branch

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR Contributors
        id: get_contributors
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            // Get all commits for the pull request
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            // Use a Set to ensure unique email addresses
            const emails = new Set();
            for (const commit of commits) {
              // The commit object contains the commit metadata under commit.commit.author.email
              if (commit.commit && commit.commit.author && commit.commit.author.email) {
                emails.add(commit.commit.author.email);
              }
            }
            const emailList = Array.from(emails).join(", ");
            core.info(`Contributor Emails: ${emailList}`);
            return emailList;
          result-encoding: string
