name: Notify Release PR Contributors

on:
  pull_request:
    types: [opened, reopened]
    # branches:
    #   - master  # or your release branch

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR Contributors
        id: get_contributors
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            // Collect unique usernames from the commits
            const uniqueUsernames = new Set();
            for (const commit of commits) {
              if (commit.author && commit.author.login) {
                uniqueUsernames.add(commit.author.login);
              }
            }
            // Retrieve full names for each unique username
            const contributorsFullNames = [];
            for (const username of Array.from(uniqueUsernames)) {
              try {
                const { data: userData } = await github.rest.users.getByUsername({ username });
                // Use the full name if set, otherwise fallback to username
                contributorsFullNames.push(userData.name ? userData.name : username);
              } catch (error) {
                // In case of an error, fallback to the username
                contributorsFullNames.push(username);
              }
            }
            const contributorList = contributorsFullNames.join(", ");
            core.info(`Contributors: ${contributorList}`);
            return contributorList;
          result-encoding: string
