name: Notify PR Events via Slack

on:
  pull_request:
    types: [opened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Extract unique contributor emails from the PR commits.
      - name: Get PR Contributor Emails
        id: get_contributors
        if: github.event.action == 'opened' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const emails = new Set();
            for (const commit of commits) {
              if (commit.commit && commit.commit.author && commit.commit.author.email) {
                emails.add(commit.commit.author.email);
              }
            }
            const emailList = Array.from(emails).join(", ");
            core.info(`Contributor Emails: ${emailList}`);
            return emailList;
          result-encoding: string

      # Step 2: For each email, look up the Slack user and build Slack mentions.
      - name: Get Slack IDs for Contributor Emails
        id: get_slack_ids
        uses: actions/github-script@v6
        env:
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
        with:
          script: |
            // Split the email string into an array and filter out empties.
            const emails = "${{ steps.get_contributors.outputs.result }}".split(", ").filter(email => email);
            const slackIds = [];
            for (const email of emails) {
              const res = await fetch(`https://slack.com/api/users.lookupByEmail?email=${encodeURIComponent(email)}`, {
                headers: {
                  "Authorization": `Bearer ${process.env.SLACK_API_TOKEN}`,
                  "Content-Type": "application/x-www-form-urlencoded"
                }
              });
              const data = await res.json();
              if (data.ok && data.user && data.user.id) {
                slackIds.push(`<@${data.user.id}>`);
              } else {
                // Fallback to email if lookup fails.
                slackIds.push(email);
              }
            }
            const slackIdList = slackIds.join(", ");
            core.info(`Slack IDs: ${slackIdList}`);
            return slackIdList;
          result-encoding: string

      # # Step 3: Send a Slack notification on PR opened.
      # - name: Send Slack Notification on PR Opened
      #   if: github.event.action == 'opened'
      #   uses: rtCamp/action-slack-notify@v2
      #   env:
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
      #     SLACK_MESSAGE: "🚀 A new pull request has been opened in *${{ github.repository }}*.\nContributors: ${{ steps.get_slack_ids.outputs.result }}"
      #     SLACK_COLOR: "#36a64f"

      # Step 4: Send a Slack notification on PR merged.
      - name: Send Slack Notification on PR Merged
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: "✅ A pull request has been merged into *${{ github.repository }}*.\nContributors: ${{ steps.get_slack_ids.outputs.result }}"
          SLACK_COLOR: "#2eb886"

      - name: Send Slack Notification on PR Opened
        if: github.event.action == 'opened'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_API_TOKEN }}
          payload: |
            channel: ${{ secrets.API_V4_CHANNEL_ID }}
            text: "🚀 Hello Contributors, Release PR for the next API releases have been cut. Please review your contributions and approve if they look as expected. If changes need to be made, please contact the API team in <@channel>.\nPR Link: <${{ github.event.pull_request.html_url }} \ncc: ${{ steps.get_slack_ids.outputs.result }}"


        
